<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وكالة لطفي - قطع سيارات كورية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gold: #d4af37;
            --bg-dark: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-light: #f5f5f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- الهيدر والشعار المتحرك --- */
        header {
            background: rgba(15, 15, 15, 0.95);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .animated-logo {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            animation: pulse-glow 2.5s infinite alternate;
            transition: transform 0.3s;
        }

        .animated-logo:hover {
            transform: scale(1.1) rotate(8deg);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px var(--gold); }
            100% { box-shadow: 0 0 20px var(--gold), 0 0 30px var(--gold); }
        }

        .brand h1 {
            color: var(--gold);
            font-size: 1.6em;
        }

        /* --- قسم الهيرو (الواجهة الرئيسية) --- */
        .hero {
            position: relative;
            padding: 80px 20px;
            text-align: center;
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid #333;
        }

        .hero-overlay {
            position: absolute;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
        }

        .badge-korea {
            display: inline-block;
            background: var(--gold);
            color: #000;
            padding: 6px 16px;
            font-weight: bold;
            border-radius: 20px;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .hero h2 {
            font-size: 2.5em;
            color: #fff;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 1.2em;
            color: #ccc;
            margin-bottom: 20px;
        }

        .location-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--gold);
            font-size: 1.2em;
            margin-top: 10px;
            font-weight: bold;
        }

        /* --- قسم التواصل --- */
        .contact-section {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        .section-title {
            text-align: center;
            color: var(--gold);
            margin-bottom: 30px;
            font-size: 1.8em;
        }

        .phone-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .phone-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: border-color 0.3s;
        }

        .phone-card:hover {
            border-color: var(--gold);
        }

        .phone-number {
            font-size: 1.4em;
            font-weight: bold;
            color: #fff;
            margin: 10px 0 15px;
            direction: ltr;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }
        .btn-call { background-color: #2980b9; color: white; }
        .btn-wa { background-color: #25d366; color: white; }

        .social-box {
            text-align: center;
            margin: 30px 0;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--gold);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            text-decoration: none;
            transition: background 0.3s, color 0.3s;
        }

        .social-icon:hover {
            background: var(--gold);
            color: #000;
        }

        footer {
            margin-top: auto;
            background: #080808;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <!-- الهيدر بالشعار المتحرك -->
    <header>
        <div class="brand">
            <!-- الشعار يقرأ ملف logo.jpg المرفوع على جيت هاب -->
            <img src="logo.jpg" alt="شعار وكالة لطفي" class="animated-logo" onerror="this.src='https://via.placeholder.com/100/d4af37/000000?text=لطفي'">
            <h1>وكالة لطفي</h1>
        </div>
    </header>

    <!-- الواجهة الرئيسية -->
    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="badge-korea">متخصصون في القطع الكورية فقط</span>
            <h2>تميز في كل قطعة غيار</h2>
            <p>قطع غيار أصلية ومضمونة للسيارات الكورية (Hyundai, Kia)</p>
            <div class="location-info">
                <i class="fas fa-map-marker-alt"></i>
                <span>معرة النعمان - نزلة تلمنس</span>
            </div>
        </div>
    </section>

    <!-- أزرار التواصل المباشرة -->
    <section class="contact-section">
        <h3 class="section-title">تواصل معنا المباشر</h3>
        <div class="phone-cards">
            
            <!-- الرقم الأول -->
            <div class="phone-card">
                <i class="fas fa-headset fa-2x" style="color: var(--gold);"></i>
                <div class="phone-number">0944526994</div>
                <div class="action-btns">
                    <a href="tel:0944526994" class="btn btn-call"><i class="fas fa-phone"></i> اتصال</a>
                    <a href="https://wa.me/963944526994" target="_blank" class="btn btn-wa"><i class="fab fa-whatsapp"></i> واتساب</a>
                </div>
            </div>

            <!-- الرقم الثاني -->
            <div class="phone-card">
                <i class="fas fa-mobile-alt fa-2x" style="color: var(--gold);"></i>
                <div class="phone-number">0945550530</div>
                <div class="action-btns">
                    <a href="tel:0945550530" class="btn btn-call"><i class="fas fa-phone"></i> اتصال</a>
                    <a href="https://wa.me/963945550530" target="_blank" class="btn btn-wa"><i class="fab fa-whatsapp"></i> واتساب</a>
                </div>
            </div>

        </div>

        <!-- السوشيال ميديا (استبدل # بروابط صفحتك في أي وقت) -->
        <div class="social-box">
            <p style="color: #888;">صفحاتنا على وسائل التواصل الاجتماعي:</p>
            <div class="social-links">
                <a href="#" target="_blank" class="social-icon"><i class="fab fa-instagram"></i></a>
                <a href="#" target="_blank" class="social-icon"><i class="fab fa-facebook-f"></i></a>
                <a href="#" target="_blank" class="social-icon"><i class="fab fa-tiktok"></i></a>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 وكالة لطفي - جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
