<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدير - وكالة لطفي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root { 
            --primary-color: #f7b731; 
            --dark-bg: #1a1a1a; 
            --light-bg: #f4f6f9; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--light-bg); 
            margin: 0; 
            padding: 20px; 
            color: #333; 
        }
        .admin-container { 
            max-width: 800px; 
            margin: 30px auto; 
            background: #fff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h1 { 
            color: var(--dark-bg); 
            border-bottom: 3px solid var(--primary-color); 
            padding-bottom: 10px; 
            margin-bottom: 25px; 
        }
        .form-section { margin-bottom: 25px; }
        .form-section h3 { 
            color: var(--dark-bg); 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="tel"], input[type="url"] { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px; 
        }
        .btn-save { 
            background-color: var(--primary-color); 
            color: var(--dark-bg); 
            border: none; 
            padding: 12px 25px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            transition: background 0.3s;
        }
        .btn-save:hover { background-color: #e0a320; }
        .alert { 
            display: none; 
            padding: 12px; 
            background-color: #d4edda; 
            color: #155724; 
            border-radius: 6px; 
            margin-bottom: 20px; 
            text-align: center; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="admin-container">
    <h1><i class="fas fa-user-cog"></i> لوحة تحكم المدير السحابية - وكالة لطفي</h1>
    <div id="alertMsg" class="alert">تم نشر التحديثات بنجاح وسوف تظهر لجميع الزوار الآن!</div>

    <form id="adminForm">
        <!-- قسم الصور والألوان -->
        <div class="form-section">
            <h3><i class="fas fa-image"></i> صور الموقع والرأس</h3>
            <div class="form-group">
                <label>رابط صورة الشعار (Logo):</label>
                <input type="url" id="logoUrl" placeholder="https://example.com/logo.jpg">
            </div>
            <div class="form-group">
                <label>رابط صورة خلفية الموقع (Hero BG):</label>
                <input type="url" id="bgImageUrl" placeholder="https://example.com/background.jpg">
            </div>
            <div class="form-group">
                <label>لون الخلفية الرئيسي:</label>
                <input type="color" id="bgColor" value="#1a1a1a" style="height: 40px; cursor: pointer;">
            </div>
        </div>

        <!-- قسم النصوص -->
        <div class="form-section">
            <h3><i class="fas fa-edit"></i> النصوص والعناوين</h3>
            <div class="form-group">
                <label>العنوان الرئيسي:</label>
                <input type="text" id="mainTitle" placeholder="تميز في كل قطعة غيار">
            </div>
            <div class="form-group">
                <label>العنوان الفرعي (التخصصات):</label>
                <input type="text" id="subTitle" placeholder="متخصصون في قطع غيار Mercedes, BMW, Hyundai">
            </div>
        </div>

        <!-- قسم التواصل -->
        <div class="form-section">
            <h3><i class="fas fa-phone"></i> التواصل والدعم</h3>
            <div class="form-group">
                <label>رقم الهاتف الأول (اتصال):</label>
                <input type="tel" id="phone1" placeholder="0944526994">
            </div>
            <div class="form-group">
                <label>رقم الهاتف الثاني (واتساب):</label>
                <input type="tel" id="phone2" placeholder="0945550530">
            </div>
            <div class="form-group">
                <label>رابط إنستغرام:</label>
                <input type="url" id="instaUrl" placeholder="https://instagram.com/...">
            </div>
            <div class="form-group">
                <label>رابط فيسبوك:</label>
                <input type="url" id="fbUrl" placeholder="https://facebook.com/...">
            </div>
            <div class="form-group">
                <label>رابط تيك توك:</label>
                <input type="url" id="tiktokUrl" placeholder="https://tiktok.com/@...">
            </div>
        </div>

        <button type="submit" class="btn-save"><i class="fas fa-cloud-upload-alt"></i> نشر التعديلات لجميع الزوار</button>
    </form>
</div>

<!-- مكتبات Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // ⚠️ استبدل القيم التالية بروابط وإعدادات مشروعك من Firebase Console
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // قراءة البيانات القديمة تلقائياً من الفايربيس عند فتح الصفحة
    db.ref('siteData').once('value', (snapshot) => {
        const data = snapshot.val();
        if(data) {
            if(data.logoUrl) document.getElementById('logoUrl').value = data.logoUrl;
            if(data.bgImageUrl) document.getElementById('bgImageUrl').value = data.bgImageUrl;
            if(data.bgColor) document.getElementById('bgColor').value = data.bgColor;
            if(data.mainTitle) document.getElementById('mainTitle').value = data.mainTitle;
            if(data.subTitle) document.getElementById('subTitle').value = data.subTitle;
            if(data.phone1) document.getElementById('phone1').value = data.phone1;
            if(data.phone2) document.getElementById('phone2').value = data.phone2;
            if(data.instaUrl) document.getElementById('instaUrl').value = data.instaUrl;
            if(data.fbUrl) document.getElementById('fbUrl').value = data.fbUrl;
            if(data.tiktokUrl) document.getElementById('tiktokUrl').value = data.tiktokUrl;
        }
    });

    // حفظ البيانات وإرسالها للسحاب عند الضغط على الزر
    document.getElementById('adminForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const siteData = {
            logoUrl: document.getElementById('logoUrl').value,
            bgImageUrl: document.getElementById('bgImageUrl').value,
            bgColor: document.getElementById('bgColor').value,
            mainTitle: document.getElementById('mainTitle').value,
            subTitle: document.getElementById('subTitle').value,
            phone1: document.getElementById('phone1').value,
            phone2: document.getElementById('phone2').value,
            instaUrl: document.getElementById('instaUrl').value,
            fbUrl: document.getElementById('fbUrl').value,
            tiktokUrl: document.getElementById('tiktokUrl').value
        };

        db.ref('siteData').set(siteData).then(() => {
            const alert = document.getElementById('alertMsg');
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 3000);
        }).catch((err) => {
            alert("حدث خطأ أثناء الحفظ: " + err.message);
        });
    });
</script>

</body>
</html>
